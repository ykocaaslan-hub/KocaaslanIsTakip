plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kocaaslan.istakip'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kocaaslan.istakip.genel'
        minSdk 23
        targetSdk 36
        versionCode 6
        versionName '1.4.0'
    }

    signingConfigs {
        release {
            def signingPassword = System.getenv("KOCAASLAN_SIGNING_PASSWORD")
            storeFile file("kocaaslan-release.jks")
            storePassword signingPassword
            keyAlias "kocaaslan"
            keyPassword signingPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
