plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.kocaaslan.istakip'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kocaaslan.istakip'
        minSdk 23
        targetSdk 36
        versionCode 127
        versionName '1.6.7'
        buildConfigField 'String', 'BUILD_REVISION', '"' + (System.getenv('KOCAASLAN_BUILD_REVISION') ?: 'local') + '"'
    }

    buildFeatures { buildConfig = true }

    signingConfigs {
        release {
            def signingPassword = System.getenv("KOCAASLAN_SIGNING_PASSWORD")
            storeFile file("kocaaslan-release.jks")
            storePassword signingPassword
            keyAlias "kocaaslan"
            keyPassword signingPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    testOptions { unitTests.includeAndroidResources = true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}

