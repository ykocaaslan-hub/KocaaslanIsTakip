name: Kocaaslan Is Takip APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: 1.4.8 kaynak hazirla
        run: |
          cp -R sync-src app
          sed -i "s/versionCode 102/versionCode 108/" app/app/build.gradle
          sed -i "s/versionName '1.4.2'/versionName '1.4.8'/" app/app/build.gradle
          python3 scripts/patch145.py

      - name: Imzalama dosyasini yerlestir
        run: cp kocaaslan-release.jks app/app/kocaaslan-release.jks

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android SDK paketlerini kur
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: APK olustur
        env:
          KOCAASLAN_SIGNING_PASSWORD: ${{ secrets.KOCAASLAN_SIGNING_PASSWORD }}
        run: cd app && gradle --no-daemon :app:assembleRelease

      - name: APK dosyasini kaydet
        uses: actions/upload-artifact@v4
        with:
          name: KocaaslanIsTakip-1.4.8-CiftYonlu-Senkron-APK
          path: app/app/build/outputs/apk/release/app-release.apk
