name: Kocaaslan Is Takip APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Projeyi ac
        run: unzip -q -o KocaaslanIsTakip_v1.4.2_TelefonFix_Kaynak-2.zip

      - name: 1.4.3 veritabani uyumluluk duzeltmesi
        run: |
          sed -i 's/private static final int DB_VERSION = 1;/private static final int DB_VERSION = 2;/' app/src/main/java/com/kocaaslan/istakip/DbHelper.java
          grep 'DB_VERSION = 2' app/src/main/java/com/kocaaslan/istakip/DbHelper.java

      - name: Imzalama dosyasini yerlestir
        run: cp kocaaslan-release.jks app/kocaaslan-release.jks

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android SDK paketlerini kur
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: APK olustur
        env:
          KOCAASLAN_SIGNING_PASSWORD: ${{ secrets.KOCAASLAN_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: APK dosyasini kaydet
        uses: actions/upload-artifact@v4
        with:
          name: KocaaslanIsTakip-1.4.3-TelefonFix-DB-Uyumlu-APK
          path: app/build/outputs/apk/release/app-release.apk
