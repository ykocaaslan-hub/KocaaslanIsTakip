
name: Kocaaslan Is Takip APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Projeyi ZIP dosyasindan cikar
        run: unzip -q KocaaslanIsTakip_Android_Proje_v2.zip

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android SDK paketlerini kur
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: APK olustur
        working-directory: KocaaslanIsTakip
        run: gradle --no-daemon :app:assembleDebug

      - name: APK dosyasini kaydet
        uses: actions/upload-artifact@v4
        with:
          name: KocaaslanIsTakip-APK
          path: KocaaslanIsTakip/app/build/outputs/apk/debug/app-debug.apk
