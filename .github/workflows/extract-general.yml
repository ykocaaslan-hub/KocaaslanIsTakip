name: Genel Dagitim Kaynaklarini Ac

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: genel-dagitim

      - name: Kaynak ZIP dosyasini ac
        run: |
          rm -rf general-src
          mkdir -p general-src
          unzip -q -o KocaaslanIsTakip_v1.3.1_Codex_Uygulanmis.zip -d general-src

      - name: Kaynaklari genel dagitim dalina kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add general-src
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "Genel dagitim kaynaklarini ac [skip ci]"
            git push origin genel-dagitim
          fi
