name: Kocaaslan Source Diagnose

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect 1.4.2 source
        run: |
          mkdir -p inspection/src
          unzip -q -o KocaaslanIsTakip_v1.4.2_TelefonFix_Kaynak-2.zip -d inspection/src
          find inspection/src -type f | sort > inspection/files.txt
          find inspection/src -type f \( -name '*.java' -o -name '*.kt' -o -name '*.xml' -o -name 'build.gradle' -o -name 'settings.gradle' -o -name 'gradle.properties' -o -name 'AndroidManifest.xml' \) -print0 | sort -z | while IFS= read -r -d '' x; do
            echo "===== $x ====="
            cat "$x"
            echo
          done > inspection/source.txt
          rm -rf inspection/src
      - uses: actions/upload-artifact@v4
        with:
          name: KocaaslanIsTakip-142-Diagnose
          path: inspection
